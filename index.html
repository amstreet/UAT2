<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — Timothy Ehrlich, MD</title>
  <meta name="description" content="A new site for Dr. Timothy Ehrlich is on the way.">
  <meta name="robots" content="noindex">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Open Graph / social share -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Timothy Ehrlich, MD">
  <meta property="og:title" content="Timothy Ehrlich, MD">
  <meta property="og:description" content="A new site is on the way.">
  <meta property="og:url" content="https://timothyehrlichmd.com/">
  <meta property="og:image" content="https://timothyehrlichmd.com/logo-blue.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F7FAFC;
      color: #1A2430;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem 5rem;
    }
    .cs {
      max-width: 560px;
      text-align: center;
    }
    .cs-logo {
      width: 220px;
      max-width: 70%;
      height: auto;
      display: block;
      margin: 0 auto 2.5rem;
    }
    .cs-rule {
      width: 36px;
      height: 1px;
      background: #5B8EA5;
      margin: 0 auto 1.5rem;
      opacity: 0.7;
    }
    .cs-title {
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-weight: 500;
      font-size: clamp(2rem, 5vw, 2.75rem);
      color: #1F5F94;
      line-height: 1.2;
      letter-spacing: -0.01em;
      margin-bottom: 1.15rem;
    }
    .cs-text {
      font-size: 1.02rem;
      color: #4A5765;
      max-width: 460px;
      margin: 0 auto;
    }
    .cs-footer {
      position: fixed;
      left: 0; right: 0;
      bottom: 1.5rem;
      text-align: center;
      font-size: 0.78rem;
      color: #8596A3;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <main class="cs">
    <img src="logo-blue.png" alt="Timothy Ehrlich, M.D." class="cs-logo">
    <div class="cs-rule" aria-hidden="true"></div>
    <h1 class="cs-title">A new site is on the way.</h1>
    <p class="cs-text">We're putting the finishing touches on it now. Please check back soon.</p>
  </main>
  <footer class="cs-footer">
    <span>&copy; 2026 Timothy Ehrlich, M.D.</span>
  </footer>
</body>
</html>
