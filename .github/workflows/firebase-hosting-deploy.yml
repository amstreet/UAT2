name: Deploy to Firebase (manual)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional note for the deploy log"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy hosting + functions + firestore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Write service-account credentials to disk
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TIMOTHYEHRLICHMD }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"

      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          firebase deploy \
            --only hosting,functions,firestore \
            --project timothyehrlichmd \
            --non-interactive

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
